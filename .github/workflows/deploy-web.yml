name: Deploy web to GitHub Pages

on:
  # Production = main uniquement ; relance manuelle possible depuis l'onglet Actions
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npx jest --ci

      # GitHub Pages sert le site sous /<nom-du-depot>/
      - name: Set web base URL
        run: |
          jq --arg base "/${{ github.event.repository.name }}" \
            '.expo.experiments.baseUrl = $base' app.json > app.json.tmp
          mv app.json.tmp app.json

      # La cle "anon" Supabase est publique par conception (protegee par la RLS).
      # Ne jamais mettre ici la cle service_role ni la cle Anthropic.
      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://kwzghvmwsrodpomtmfjt.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3emdodm13c3JvZHBvbXRtZmp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NjEzMTMsImV4cCI6MjA4NTMzNzMxM30.SW48Gk_s2tAMWKdWcsBApDK_STdWy6jCm-EldvrehN4
          EXPO_PUBLIC_APP_ENV: production

      - name: Prepare for Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
